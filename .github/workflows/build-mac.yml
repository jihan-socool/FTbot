# FTbot: build an installable DMG for Apple silicon Macs on GitHub's macOS runners.
#
# No Apple Developer account is needed: the app is ad-hoc signed ("-"), not notarized. On the Mac, open the DMG,
# drag FTbot to Applications, then right-click it and choose Open the first time (or allow it in
# System Settings > Privacy & Security). macOS may ask again for Accessibility and Screen Recording after each new build.
#
# Run it from the Actions tab (Build FTbot for Mac > Run workflow), or push a tag such as v0.1.0.
# The DMG is attached to the run as an artifact named FTbot-mac-arm64.
name: Build FTbot for Mac

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: macOS arm64 DMG (ad-hoc signed)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run FTbot's own tests
        run: pnpm exec vitest run server/ftbot-main-bot.test.ts

      - name: Build the app's parts
        # macos-15 runners have 7 GB; the server build needs more than Node's default heap.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          rm -rf dist dist-server dist-native release
          pnpm package:prepare
          pnpm build:speech
          pnpm build:cua

      - name: Package the DMG (Apple silicon, ad-hoc signed)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never -c.mac.identity=- -c.dmg.sign=false

      - name: Check the app's signature
        run: |
          app=$(find release -maxdepth 2 -name '*.app' -type d | head -1)
          test -n "$app" || { echo "::error::no .app was produced"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          ls -lh release/*.dmg

      - name: Check the packaged server and the bots' browser start
        run: |
          resources="$PWD/release/mac-arm64/FTbot.app/Contents/Resources"
          node scripts/smoke-browser-bundle.mjs --resources "$resources"
          OMB_SMOKE_DIST="$resources/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$resources/browser-engine"

      - name: Open FTbot as you would and wait for it to answer
        run: |
          app="$PWD/release/mac-arm64/FTbot.app"
          log="$RUNNER_TEMP/ftbot-launch.log"
          "$app/Contents/MacOS/FTbot" > "$log" 2>&1 &
          pid=$!
          show_logs() {
            echo "--- app output"; tail -n 80 "$log" || true
            for f in "$HOME/Library/Logs/FTbot"/*.log; do [ -f "$f" ] && { echo "--- $f"; tail -n 80 "$f"; }; done
          }
          answered=""
          for second in $(seq 1 120); do
            for port in 8799 18799 28799; do
              if curl -fsS --max-time 2 "http://127.0.0.1:$port/api/health" 2>/dev/null | grep -q '"app":"ftbot"'; then
                answered=$port; break 2
              fi
            done
            kill -0 "$pid" 2>/dev/null || { echo "::error::FTbot quit right after it opened"; show_logs; exit 1; }
            sleep 1
          done
          test -n "$answered" || { echo "::error::FTbot opened but its server never answered"; show_logs; kill "$pid" || true; exit 1; }
          echo "FTbot answered on port $answered after about ${second}s"
          curl -fsS --max-time 5 "http://127.0.0.1:$answered/" | grep -qi "<html" || { echo "::error::FTbot's window page did not load"; show_logs; kill "$pid" || true; exit 1; }
          show_logs
          kill "$pid" || true
          sleep 5
          pkill -f "FTbot.app/Contents" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FTbot-mac-arm64
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
